name: Build Windows installer

on:
  push:
    branches: [main]
  pull_request:
  # Publishing a release on GitHub builds the installer and attaches it to that release,
  # which is what running copies download to update themselves.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release to attach the installer to, e.g. v0.5.1 (optional)"
        required: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Matcher report
        run: python -m tests.labelled_eval

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests on Windows
        run: python -m pytest -q
      - name: Version
        id: v
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          app=$(grep -oP 'VERSION = "\K[^"]+' core/version.py)
          echo "version=$app" >> $GITHUB_OUTPUT
          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          if [[ -n "$RELEASE_TAG" && "${RELEASE_TAG#v}" != "$app" ]]; then
            echo "::error::Release $RELEASE_TAG does not match the app version $app in core/version.py. Publish v$app instead."
            exit 1
          fi
      - name: Bundle with PyInstaller
        run: pyinstaller installer/sx200.spec --noconfirm
      - name: Bundle self-test (recipes load and parse their saved pages)
        run: dist\SX200Tracker\SX200Tracker-cli.exe --selftest
      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer\setup.iss /DMyAppVersion=${{ steps.v.outputs.version }}
      - name: Silent install as this user, then check the files and the login entry
        shell: pwsh
        run: |
          # Wait for the installer process only (-Wait would also wait for anything it starts).
          $p = Start-Process dist\SX200-Tracker-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
          if (-not $p.WaitForExit(300000)) { throw "installer did not finish within 5 minutes" }
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\SX200 Tracker\SX200Tracker.exe"
          if (-not (Test-Path $exe)) { throw "not installed" }
          $run = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name SX200Tracker
          if (-not $run.SX200Tracker) { throw "no Startup entry" }
          & "$env:LOCALAPPDATA\Programs\SX200 Tracker\SX200Tracker-cli.exe" --selftest
      # Optional code signing: add a certificate as repository secrets and a signtool step here.
      # Without it, Windows SmartScreen shows a blue warning: "More info", then "Run anyway".
      - name: Checksum (running installs verify updates against it)
        shell: pwsh
        run: (Get-FileHash dist\SX200-Tracker-Setup.exe -Algorithm SHA256).Hash.ToLower() + "  SX200-Tracker-Setup.exe" | Out-File -Encoding ascii dist\SX200-Tracker-Setup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SX200-Tracker-Setup
          path: |
            dist/SX200-Tracker-Setup.exe
            dist/SX200-Tracker-Setup.exe.sha256
      - name: Attach installer to the release
        if: steps.v.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.v.outputs.tag }}" dist/SX200-Tracker-Setup.exe dist/SX200-Tracker-Setup.exe.sha256 --clobber --repo "$GITHUB_REPOSITORY"
