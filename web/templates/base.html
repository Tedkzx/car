<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SX200 Tracker</title>
<script src="/static/htmx.min.js"></script>
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#1d1f23;--muted:#5d636d;--line:#dcdfe4;--accent:#1f5fbf;--accent-ink:#fff;
--good:#1e7a46;--good-bg:#e5f4ea;--warn:#a35a00;--warn-bg:#fff2dc;--bad:#b3261e;--bad-bg:#fde8e6}
@media (prefers-color-scheme: dark){:root{--bg:#15171a;--card:#1f2226;--ink:#eceef1;--muted:#a3a9b3;--line:#33373d;
--accent:#6aa3ff;--accent-ink:#0b1424;--good:#6fd39a;--good-bg:#183324;--warn:#ffc266;--warn-bg:#3a2a10;--bad:#ff8a80;--bad-bg:#3d1a17}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Segoe UI",system-ui,sans-serif}
a{color:var(--accent)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:22px;margin:0}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--ink);border:1px solid var(--line);font-size:16px}
nav a.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav .n{font-weight:700;margin-left:4px}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:12px;margin-bottom:18px}
.banner.ok{background:var(--good-bg);color:var(--good)}
.banner.notok{background:var(--warn-bg);color:var(--warn)}
.banner small{color:var(--muted)}
button,.btn{font:inherit;font-size:17px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cards{display:grid;gap:16px}
.card{display:grid;grid-template-columns:260px 1fr;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
@media (max-width:700px){.card{grid-template-columns:1fr}}
.photo{height:190px;border-radius:10px;background:var(--line);overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}
.card h2{font-size:21px;margin:0 0 4px}
.price{font-size:26px;font-weight:700}
.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:15px}
.score{font-weight:700;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.flag{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.why{font-size:15px;color:var(--muted);margin:6px 0;padding-left:20px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.links a{margin-right:12px}
textarea{width:100%;font:inherit;font-size:16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px}
.saved{color:var(--good)} .warn{color:var(--warn)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}
label{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=number]{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:min(320px,100%)}
.check label{display:flex;gap:10px;align-items:center;font-weight:400}
table{border-collapse:collapse;width:100%}
td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line)}
.st-Working{color:var(--good);font-weight:700}.st-Slow,.st-Being{color:var(--warn);font-weight:700}.st-Needs{color:var(--bad);font-weight:700}
.empty{padding:40px;text-align:center;color:var(--muted)}
.bar{height:14px;background:var(--line);border-radius:7px;overflow:hidden}.bar>div{height:100%;background:var(--accent)}
.note{font-size:15px;color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:700px){.pair{grid-template-columns:1fr}}
.mini{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.mini .photo{height:150px}
</style>
</head>
<body>
<header>
  <h1>SX200 Tracker</h1>
  {% if cfg.setup_complete %}
  <nav>
    {% for key, label in views.items() %}<a href="/?view={{ key }}" class="{{ 'on' if view == key else '' }}">{{ label }}{% if counts.get(key) %}<span class="n">{{ counts[key] }}</span>{% endif %}</a>{% endfor %}
    {% if counts.get('duplicates') %}<a href="/duplicates" class="{{ 'on' if view == 'duplicates' else '' }}">Same car?<span class="n">{{ counts.duplicates }}</span></a>{% endif %}
    <a href="/sources" class="{{ 'on' if view == 'sources' else '' }}">Sources</a>
    <a href="/settings" class="{{ 'on' if view == 'settings' else '' }}">Settings</a>
  </nav>
  {% endif %}
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
