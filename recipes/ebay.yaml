# eBay UK through eBay's official Browse API. Free developer key needed (App ID + Cert ID),
# pasted into Settings once and kept in Windows Credential Manager. Without a key: Off.
# Replaces scraping, which eBay blocked from the cloud and from the owner's home connection.
name: ebay
display_name: eBay UK
group: uk_marketplace
status: unverified          # verified once a real key has returned results
min_app_version: "0.4.0"
method: api
adapter: ebay_api
country: uk
min_interval_minutes: 30    # well inside eBay's free allowance of 5,000 calls a day
terms: [nissan 200sx, nissan silvia, nissan s14, nissan s15]
searches: [api]
extract: [api]
